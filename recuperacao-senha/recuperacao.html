
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperação de Senha | Café & Grãos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="recuperacao.css">
    <script src="recuperacao.js" defer></script>
</head>

<body>

    <!-- Barra de acessibilidade -->
    <div class="barra-acessibilidade" aria-label="Opções de acessibilidade">

        <button type="button" id="diminuir-fonte" aria-label="Diminuir fonte">
            A-
        </button>

        <button type="button" id="aumentar-fonte" aria-label="Aumentar fonte">
            A+
        </button>

        <button type="button" id="alternar-tema" aria-label="Ativar tema escuro">
            🌙
        </button>

    </div>

    <!-- Conteúdo principal -->
    <main class="container">

        <div class="caixa-recuperacao">

            <h1>Recuperação de Senha</h1>

            <p class="texto">
                Digite seus dados para redefinir sua senha.
            </p>

            <form id="formulario" novalidate>

                <!-- Campo de e-mail -->
                <div class="grupo-campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- Código de verificação -->
                <div class="grupo-campo">

                    <label for="codigo">Código de verificação</label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Digite o código de verificação"
                        autocomplete="one-time-code"
                        required
                    >

                </div>

                <!-- Nova senha -->
                <div class="grupo-campo">

                    <label for="senha">Nova senha</label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua nova senha"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-campo="senha"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >

                            <!-- Ícone inicial: olho riscado -->
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M10.58 5.08A10.8 10.8 0 0 1 12 5c7 0 10 7 10 7a16.6 16.6 0 0 1-3.18 4.13"/>
                                <path d="M6.61 6.61C3.58 8.43 2 12 2 12s3 7 10 7a10.7 10.7 0 0 0 5.39-1.61"/>
                                <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
                                <line x1="2" y1="2" x2="22" y2="22"/>
                            </svg>

                        </button>

                    </div>

                </div>

                <!-- Confirmar nova senha -->
                <div class="grupo-campo">

                    <label for="confirmar">Confirmar nova senha</label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="confirmar"
                            name="confirmar"
                            placeholder="Confirme sua nova senha"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-campo="confirmar"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >

                            <!-- Ícone inicial: olho riscado -->
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M10.58 5.08A10.8 10.8 0 0 1 12 5c7 0 10 7 10 7a16.6 16.6 0 0 1-3.18 4.13"/>
                                <path d="M6.61 6.61C3.58 8.43 2 12 2 12s3 7 10 7a10.7 10.7 0 0 0 5.39-1.61"/>
                                <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
                                <line x1="2" y1="2" x2="22" y2="22"/>
                            </svg>

                        </button>

                    </div>

                </div>

                <!-- Botão de redefinir senha -->
                <button type="submit" class="botao">
                    Redefinir senha
                </button>

                <!-- Mensagem de confirmação -->
                <p id="mensagem" role="status" aria-live="polite"></p>

                <!-- Voltar ao login -->
                <p class="voltar-login">
                    Lembrou sua senha?
                    <a href="../login/login.html">Voltar ao login</a>
                </p>

            </form>

        </div>

    </main>

</body>
</html>
