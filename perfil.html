<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pefil de Café</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <h1><strong>Seu Perfil de Café</strong></h1>
    <p class="subtitulo">Responda às questões abaixo para criarmos a sua assinatura sensorial perfeita</p>

    <h4>Com que freqência você toma café?</h4>
    <input type="radio" id="diariamente" name="Freqência" value="diariamente">
    <label for="diariamente">Diariamente</label><br>
    <input type="radio" id="algumas" name="Freqência" value="algumas">
    <label for="algumas">Algumas vezes por semana</label><br>
    <input type="radio" id="raramente" name="Freqência" value="raramentr">
    <label for="raramente">Raramente</label><br>
    <input type="radio" id="nunca" name="Freqência" value="nunca">
    <label for="Nunca">Nunca</label><br>

    <h4>Intensidade</h4>
    <input type="range" id="intensidade" min="1" max="10" value="5">
    <div class="legenda-intensidade">
        <span>Suave</span>
        <span>Intenso</span>
    </div>

    <h4>Método de preparo favorito</h4>
    <select name="metodo-preparo" id="metodo-preparo">
        <option value="coado">Coado</option>
        <option value="presna-francesa">Prensa Francesa</option>
        <option value="espresso">Espresso</option>
        <option value="moka">Cafeteria Italiana (Moka)</option>
        <option value="aeropress">Aeropress</option>
        <option value="chemex">Chemex</option>
    </select>

    <h4>Sabores que você aprecia</h4>
    <div class="sabores">
    <label><input type="checkbox"> Chocolate</label>
    <label><input type="checkbox"> Caramelo</label>
    <label><input type="checkbox"> Castanhas</label>
    <label><input type="checkbox"> Frutas</label>
    <label><input type="checkbox"> Floral</label>
    <label><input type="checkbox"> Cítrico</label>
    </div> <br>

    <h4><label for="comentario">Comentário adicionais</label></h4>
    <textarea name="comentario" id="comentario" rows="15" 
    placeholder="Conte-nos um pouco mais sobre como você prefere adoçar, se usa leite, ou qualquer outra preferência especial..."></textarea><br>
    <br>
    <button type="submit">Enviar</button>

    <script src="perfil.js"></script>    
</body>
</html>
