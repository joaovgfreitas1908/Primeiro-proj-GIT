
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações gerais da página e conexão com o CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 403 - Café & Grãos</title>
    <link rel="stylesheet" href="erro403.css">
</head>
<body>

    <!-- Container principal que organiza a imagem e a mensagem de erro -->
    <div class="container-erro">

        <!-- Imagem ilustrativa da xícara de café derramado -->
        <img src="../imagens/xicara-erro.png" alt="Café derramado" class="imagem-erro">

        <!-- Exibe o código 403 e informa que o acesso não foi autorizado -->
        <div class="texto-erro">
            <h1 class="codigo-erro">403</h1>
            <h2>Acesso não autorizado</h2>
            <p>Você precisa estar logado para acessar essa página. Por favor, autentique-se primeiro.</p>

            <!-- Botão para retornar à página de login -->
            <a href="../login/login.html" class="btn-voltar">Fazer Login</a>
        </div>

    </div>
</body>
</html>
