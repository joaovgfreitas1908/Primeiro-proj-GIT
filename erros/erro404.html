
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações gerais da página e conexão com o CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404 - Café & Grãos</title>
    <link rel="stylesheet" href="erro404.css">
</head>
<body>

    <!-- Container principal que organiza a imagem e a mensagem de erro -->
    <div class="container-erro">

        <!-- Imagem ilustrativa da xícara de café derramado -->
        <img src="../imagens/xicara-erro.png" alt="Café derramado" class="imagem-erro">

        <!-- Exibe o código 404 e informa que a página não foi encontrada -->
        <div class="texto-erro">
            <h1 class="codigo-erro">404</h1>
            <h2>Parece que o café acabou...</h2>
            <p>A página que você procura não foi encontrada, faça o quiz para descobrir seu perfil.</p>

            <!-- Botão para retornar à página de login -->
            <a href="login.html" class="btn-voltar">Voltar</a>
        </div>

    </div>
</body>
</html>
