<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café & Grãos</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container"> 
        <h2>Bem-vindo ao Café & Grãos! ☕</h2>
        <p>Acesse sua conta para continuar.</p>
        <form id="form-login" action="#" method="POST" novalidate>
            <div class="form-group"> 
                <label for="Login">Usuário</label>
                <input type="text" id = "login" name="Login"
                placeholder="Digite seu usuário" required>
                <small id="erro-usuario" class="mensagem-erro"></small>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" 
                id="senha" name="senha"
                placeholder="Digite sua senha" required
                >
                <small id="erro-senha" class="mensagem-erro"></small>
                <button type="button" id="mostrar-senha"
                >⌣</button>
            </div>
                <div class="opcoes-login">
                    <label for="lembrar">
                        <input type="checkbox" 
                        id="lembrar" name="lembrar">
                        Lembrar de mim
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>
                 </div>
                <button type="submit"
                class="btn-entrar">Entrar</button>
        </form>
        <div class="links_uteis">
            
            <span>Não tem uma conta?
                <a href="#">Criar conta</a>
            </span>

        </div>

    </div>
    <script src="login.js"></script>
</body>
</html>
